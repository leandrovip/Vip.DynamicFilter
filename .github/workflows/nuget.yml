name: Publish NuGet.org

on:
  workflow_dispatch:
    inputs:
      typeBuild:
        description: "É beta? (digite -beta)"
        required: false

env:
  # Não exibe a mensagem de boas-vindas nem popula o cache na primeira execução
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Não envia dados de uso para a Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy-package:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set Versions"
        env:
          TYPE_BUILD: ${{ github.event.inputs.typeBuild }}
        run: |
          echo "VERSION_PROJECT=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_PACKAGE=1.0.${GITHUB_RUN_NUMBER}${TYPE_BUILD}" >> "$GITHUB_ENV"

      - name: "Variables Test"
        run: |
          echo "Version: $VERSION_PROJECT"
          echo "Version2: $VERSION_PACKAGE"

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Project
        run: dotnet build ./src/Vip.DynamicFilter.sln --configuration Release -p:Version=$VERSION_PROJECT

      - name: Test Project
        run: dotnet test ./src/Vip.DynamicFilter.sln

      - name: Create Package
        run: dotnet pack ./src/Vip.DynamicFilter/Vip.DynamicFilter.csproj --configuration Release -p:Version=$VERSION_PACKAGE

      # Autenticação federada NuGet.org via OIDC
      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: leandrovip

      # Publicação utilizando a API Key temporária
      - name: Publish Package
        run: |
          dotnet nuget push ./src/Vip.DynamicFilter/bin/Release/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
